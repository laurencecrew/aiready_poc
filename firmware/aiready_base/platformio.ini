; FYSETC One+ V2.2 - AI-ready base firmware (factory image + template for new apps)
; Build:   pio run
; Upload:  aiready flash <build_dir>/one_plus/firmware.hex   (backs up, checks regions)
;          or: pio run -t upload --upload-port COM5
; Monitor: pio device monitor   (115200; send '@ai help')

[platformio]
; Keep build output off Google Drive (thousands of small files).
build_dir = ${sysenv.LOCALAPPDATA}/pio-build/one_plus_aiready_base

[env:one_plus]
platform = atmelavr
board = megaatmega2560
framework = arduino
build_flags = -I../include
lib_extra_dirs = ../lib
lib_deps = olikraus/U8g2@^2.35.9
monitor_speed = 115200
upload_speed = 115200
; Flash from 0x3A000 holds the self-description block (8 KB), a NOP fill and the bootloader:
; cap the application so the build fails before it can overlap. Keep apps below 128 KB
; (0x20000) or watchdog resets break (bootloader EIND bug, see docs/dev/hardware.md section 2).
board_upload.maximum_size = 237568
; IMPORTANT: this board's 2016 stk500v2 bootloader does NOT sync with avrdude 8.x.
platform_packages = platformio/tool-avrdude@~1.60300.0
