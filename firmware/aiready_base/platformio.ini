; FYSETC One+ V2.2 - AI-ready base firmware (factory image + template for new apps)
; Build:   pio run
; Upload:  aiready flash <build_dir>/one_plus/firmware.hex   (backs up, checks regions)
;          or: pio run -t upload --upload-port COM5
; Monitor: pio device monitor   (115200; send '@ai help')

[platformio]
; Keep build output off Google Drive (thousands of small files).
build_dir = ${sysenv.LOCALAPPDATA}/pio-build/one_plus_aiready_base

[env:one_plus]
platform = atmelavr
board = megaatmega2560
framework = arduino
build_flags = -I../include
lib_extra_dirs = ../lib
lib_deps = olikraus/U8g2@^2.35.9
monitor_speed = 115200
upload_speed = 115200
; Bootloader: Optiboot (MegaCore optiboot_flash, 1 KB at 0x3FC00, STK500v1 = avrdude 'arduino').
upload_protocol = arduino
; 0x3BC00-0x3FBFF holds the self-description block (16 KB): cap apps below it.
board_upload.maximum_size = 244736
