; FYSETC One+ (AIO v1) hardware probe / characterisation console
; Build:   pio run
; Upload:  pio run -t upload        (COM port auto-detected; add --upload-port COM5 if needed)
; Monitor: pio device monitor       (115200 baud, type 'help')

[platformio]
; Keep build output off Google Drive (thousands of small files).
build_dir = ${sysenv.LOCALAPPDATA}/pio-build/one_plus_probe

[env:one_plus]
platform = atmelavr
board = megaatmega2560
framework = arduino
build_flags = -I../include
lib_deps = arduino-libraries/SD@^1.2.4
monitor_speed = 115200
upload_speed = 115200
; Bootloader: Optiboot (MegaCore optiboot_flash, 1 KB at 0x3FC00, STK500v1 = avrdude 'arduino').
upload_protocol = arduino
; 0x3BC00-0x3FBFF holds the self-description block (16 KB): cap apps below it.
board_upload.maximum_size = 244736
