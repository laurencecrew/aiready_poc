; FYSETC One+ (AIO v1) U8g2 display driver match test (verification item J)
; Upload:  pio run -t upload --upload-port COM5
; Monitor: pio device monitor   (115200)

[platformio]
; Keep build output off Google Drive.
build_dir = ${sysenv.LOCALAPPDATA}/pio-build/one_plus_lcdtest

[env:one_plus]
platform = atmelavr
board = megaatmega2560
framework = arduino
build_flags = -I../include
lib_deps = olikraus/U8g2@^2.35.9
monitor_speed = 115200
upload_speed = 115200
; 2016 stk500v2 bootloader does NOT sync with avrdude 8.x. Pin 6.3.
platform_packages = platformio/tool-avrdude@~1.60300.0
