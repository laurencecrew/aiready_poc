; FYSETC One+ (AIO v1) U8g2 display driver match test (verification item J)
; Upload:  pio run -t upload --upload-port COM5
; Monitor: pio device monitor   (115200)

[platformio]
; Keep build output off Google Drive.
build_dir = ${sysenv.LOCALAPPDATA}/pio-build/one_plus_lcdtest

[env:one_plus]
platform = atmelavr
board = megaatmega2560
framework = arduino
build_flags = -I../include
lib_deps = olikraus/U8g2@^2.35.9
monitor_speed = 115200
upload_speed = 115200
; Bootloader: Optiboot (MegaCore optiboot_flash, 1 KB at 0x3FC00, STK500v1 = avrdude 'arduino').
upload_protocol = arduino
; 0x3BC00-0x3FBFF holds the self-description block (16 KB): cap apps below it.
board_upload.maximum_size = 244736
